name: Daily Universal .deb Build (Independent)

on:
  schedule:
    - cron: '0 6 * * *'   # Todos os dias às 06:00 UTC
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          path: my-repo

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest release from jacktrip/jacktrip
        id: latest
        run: |
          LATEST=$(curl -s https://api.github.com/repos/jacktrip/jacktrip/releases/latest | jq -r .tag_name)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest version: $LATEST"

      - name: Read stored version
        id: stored
        run: |
          if [ -f apt-repo/VERSION ]; then
            STORED=$(cat apt-repo/VERSION)
          else
            STORED="none"
          fi
          echo "stored=$STORED" >> $GITHUB_OUTPUT

      - name: Check if new version
        id: check
        run: |
          if [ "${{ steps.latest.outputs.version }}" = "${{ steps.stored.outputs.stored }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download source tarball
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          wget -O jacktrip-${VERSION}.tar.gz \
            https://github.com/jacktrip/jacktrip/archive/refs/tags/${VERSION}.tar.gz
          tar -xzf jacktrip-${VERSION}.tar.gz
          mv jacktrip-${VERSION#v} jacktrip-source

      - name: Prepare Debian packaging
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          PKG_VERSION="${VERSION#v}-1"
          cd jacktrip-source
          cp -r ../my-repo/debian .
          cat > debian/changelog << EOF
          jacktrip (${PKG_VERSION}) stable; urgency=medium
            * Automated build from upstream release ${VERSION}
           -- GitHub Actions <actions@github.com>  $(date -R)
          EOF
          echo "11" > debian/compat
          mkdir -p debian/source
          echo "3.0 (quilt)" > debian/source/format

      # 🔥 CORREÇÃO: instala python3-yaml e todas as dependências
      - name: Build .deb in Debian 12 container (with Qt6 + PyYAML)
        if: steps.check.outputs.skip == 'false'
        uses: docker://debian:bookworm
        with:
          args: |
            bash -c "
              apt-get update &&
              apt-get install -y --no-install-recommends \
                build-essential debhelper dpkg-dev \
                meson ninja-build \
                qt6-base-dev qt6-tools-dev qt6-l10n-tools \
                libjack-jackd2-dev librtaudio-dev \
                libsamplerate0-dev \
                python3-yaml &&
              cd /github/workspace/jacktrip-source &&
              dpkg-buildpackage -us -uc -b
            "

      - name: Copy .deb to apt repository
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p apt-repo/pool/main/j/jacktrip
          cp jacktrip-source/../*.deb apt-repo/pool/main/j/jacktrip/

      - name: Generate APT metadata
        if: steps.check.outputs.skip == 'false'
        run: |
          cd apt-repo
          DIST_DIR="dists/stable/main/binary-amd64"
          mkdir -p $DIST_DIR
          apt-ftparchive packages pool/ > $DIST_DIR/Packages
          gzip -k -f $DIST_DIR/Packages
          apt-ftparchive release dists/stable > dists/stable/Release

      - name: Update VERSION file
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "${{ steps.latest.outputs.version }}" > apt-repo/VERSION

      - name: Commit and push to gh-pages
        if: steps.check.outputs.skip == 'false'
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update to version ${{ steps.latest.outputs.version }} (universal build)"
          git push