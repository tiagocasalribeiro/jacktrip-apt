name: Daily Universal .deb Build (Independent)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Forçar compilação (true/false)'
        required: true
        default: 'false'

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          path: my-repo

      - name: Checkout do ramo gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: apt-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Obter a última release do jacktrip/jacktrip
        id: latest
        run: |
          RESPONSE=$(curl -s https://api.github.com/repos/jacktrip/jacktrip/releases/latest)
          LATEST=$(echo "$RESPONSE" | jq -r .tag_name)
          BODY=$(echo "$RESPONSE" | jq -r .body)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "$BODY" > release_body.md
          echo "Última versão: $LATEST"

      - name: Ler versão armazenada
        id: stored
        run: |
          if [ -f apt-repo/VERSION ]; then
            STORED=$(cat apt-repo/VERSION)
          else
            STORED="none"
          fi
          echo "stored=$STORED" >> $GITHUB_OUTPUT

      - name: Verificar se há nova versão (ou se é forçada)
        id: check
        run: |
          if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Compilação forçada activada"
          elif [ "${{ steps.latest.outputs.version }}" = "${{ steps.stored.outputs.stored }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Descarregar o ficheiro fonte tarball
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          wget -O jacktrip-${VERSION}.tar.gz \
            https://github.com/jacktrip/jacktrip/archive/refs/tags/${VERSION}.tar.gz
          tar -xzf jacktrip-${VERSION}.tar.gz
          mv jacktrip-${VERSION#v} jacktrip-source

      - name: Preparar empacotamento Debian (com correcções automáticas)
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          PKG_VERSION="${VERSION#v}-1"
          cd jacktrip-source
          cp -r ../my-repo/debian .
          rm -f debian/compat
          chmod +x debian/rules
          mkdir -p debian/source
          echo "3.0 (quilt)" > debian/source/format
          cat > debian/changelog << EOF
          jacktrip (${PKG_VERSION}) stable; urgency=medium
            * Compilação automática a partir do lançamento original ${VERSION}
           -- GitHub Actions <actions@github.com>  $(date -R)
          EOF

      - name: Compilar .deb em contentor Debian 12
        if: steps.check.outputs.skip == 'false'
        uses: docker://debian:bookworm
        with:
          args: |
            bash -c "
              apt-get update &&
              apt-get install -y --no-install-recommends \
                build-essential autoconf automake libtool make \
                debhelper dpkg-dev meson ninja-build pkg-config \
                libjack-jackd2-dev librtaudio-dev libsamplerate0-dev \
                help2man python3-jinja2 python3-yaml \
                qt6-base-dev qt6-base-dev-tools qmake6 qt6-tools-dev \
                qt6-declarative-dev qt6-5compat-dev \
                qt6-svg-dev qt6-websockets-dev \
                qt6-webengine-dev qt6-webview-dev qt6-webview-plugins \
                qt6-shadertools-dev qt6-networkauth-dev \
                libqt6core6 libqt6gui6 libqt6network6 libqt6widgets6 \
                libqt6qml6 libqt6qmlcore6 libqt6quick6 \
                libqt6quickcontrols2-6 libqt6svg6 libqt6webchannel6 \
                libqt6webenginecore6 libqt6webenginequick6 \
                libqt6websockets6 libqt6shadertools6 \
                libqt6core5compat6-dev qt6-qpa-plugins \
                qml6-module-qtquick-controls qml6-module-qtqml-workerscript \
                qml6-module-qtquick-templates qml6-module-qtquick-layouts \
                qml6-module-qt5compat-graphicaleffects qml6-module-qtwebchannel \
                qml6-module-qtwebengine qml6-module-qtquick-window \
                qml6-module-qtquick-dialogs \
                libgl1-mesa-dev libfreetype6-dev libxi-dev \
                libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev \
                libdrm-dev libglu1-mesa-dev libwayland-dev \
                libwayland-egl1-mesa libgles2-mesa-dev &&
              cd /github/workspace/jacktrip-source &&
              dpkg-buildpackage -us -uc -b
            "

      - name: Copiar .deb para o repositório APT
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p apt-repo/pool/main/j/jacktrip
          cp jacktrip-source/../*.deb apt-repo/pool/main/j/jacktrip/

      - name: Importar chave GPG
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Gerar e assinar metadados APT (com campos Release completos)
        if: steps.check.outputs.skip == 'false'
        run: |
          cd apt-repo
          DIST_DIR="dists/stable/main/binary-amd64"
          mkdir -p $DIST_DIR
          apt-ftparchive packages pool/ > $DIST_DIR/Packages
          gzip -k -f $DIST_DIR/Packages

          apt-ftparchive release \
            -o APT::FTPArchive::Release::Origin="jacktrip-apt" \
            -o APT::FTPArchive::Release::Label="jacktrip-apt" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            -o APT::FTPArchive::Release::Description="Repositório APT do JackTrip" \
            dists/stable > dists/stable/Release

          gpg --batch --yes --detach-sign --armor -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --clearsign -o dists/stable/InRelease dists/stable/Release

      - name: Actualizar ficheiro VERSION
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "${{ steps.latest.outputs.version }}" > apt-repo/VERSION

      - name: Commit e push para gh-pages
        if: steps.check.outputs.skip == 'false'
        run: |
          cd apt-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Actualização para a versão ${{ steps.latest.outputs.version }} (repositório assinado)"
          git push

      - name: Criar Release no GitHub e anexar o .deb
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.latest.outputs.version }}
          name: JackTrip ${{ steps.latest.outputs.version }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            jacktrip-source/../*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
